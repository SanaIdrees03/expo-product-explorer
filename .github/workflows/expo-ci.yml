name: Expo CI

on:
  push:
    branches: [main, feature/products]
  pull_request:
    branches: [main]

jobs:
  expo-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Expo web export
        run: npx expo export --platform web

